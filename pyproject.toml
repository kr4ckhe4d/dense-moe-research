[project]
name = "dense-to-moe"
version = "0.1.0"
description = "Convert pretrained dense LLM FFNs into sparse Mixture-of-Experts and measure real inference speed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1+rocm7.2",
    "triton-rocm",
    "transformers>=4.57",
    "safetensors",
    "huggingface-hub",
    "accelerate",
    "datasets",
    "numpy",
    "pyyaml",
    "psutil",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dense_to_moe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
